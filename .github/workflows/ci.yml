name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ocaml-core:
    runs-on: ubuntu-latest
    env:
      LOGSEQ_GITHUB_PAT: ${{ secrets.LOGSEQ_GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: sudo apt-get install -y libsqlite3-dev libffi-dev pkg-config

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          opam-pin: false
          # "cache" (default true) caches the opam root + switch.

      - name: Install opam dependencies
        run: |
          eval $(opam env)
          # opam clears file-based git config for its fetch subprocesses, but
          # GIT_CONFIG_* env pairs pass through; use them to authenticate the
          # private pin-depends (git+ssh://github.com/logseq/...) via PAT.
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0="url.https://github.com/.insteadOf" GIT_CONFIG_VALUE_0="git@github.com:"
          export GIT_CONFIG_KEY_1="url.https://github.com/.insteadOf" GIT_CONFIG_VALUE_1="ssh://git@github.com/"
          export GIT_CONFIG_KEY_2="credential.helper"
          export GIT_CONFIG_VALUE_2='!f() { [ -n "$LOGSEQ_GITHUB_PAT" ] || exit 0; echo username=x-access-token; echo "password=$LOGSEQ_GITHUB_PAT"; }; f'
          opam pin add -n -y melange-edn-core git+https://github.com/RCmerci/melange-edn.git#3cb79f278e972388a0a2b2ea1caec7a008a0b956
          opam pin add -n -y melange-edn-native git+https://github.com/RCmerci/melange-edn.git#3cb79f278e972388a0a2b2ea1caec7a008a0b956
          opam pin add -n -y melange-transit-core git+https://github.com/RCmerci/melange-transit.git#950a5786e343f893a6e0396819383db341d5aa97
          opam pin add -n -y melange-transit-native git+https://github.com/RCmerci/melange-transit.git#950a5786e343f893a6e0396819383db341d5aa97
          opam install . --deps-only --yes --with-test --assume-depexts
          # 0.3.x matches the lockfile's x-opam-monorepo-version; 0.5 embeds an
          # opam lib too new for the runner's opam root layout.
          opam install -y opam-monorepo.0.3.6

      - name: Restore duniverse
        id: duniverse
        uses: actions/cache/restore@v4
        with:
          path: duniverse
          key: duniverse-${{ hashFiles('logseq_chat.opam.locked', 'logseq_chat.opam') }}

      - name: Pull vendored dependencies
        if: steps.duniverse.outputs.cache-hit != 'true'
        run: |
          set -e
          eval $(opam env)
          # The lockfile only lists public deps; private pin-depends are cloned
          # at their pinned commits below. Authenticate clones with the PAT.
          git config --global url."https://x-access-token:${LOGSEQ_GITHUB_PAT}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${LOGSEQ_GITHUB_PAT}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${LOGSEQ_GITHUB_PAT}@github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://x-access-token:${LOGSEQ_GITHUB_PAT}@github.com/".insteadOf "https://github.com/"
          opam monorepo pull -y
          for pin in $(grep -oE 'logseq/[A-Za-z0-9_-]+\.git#[0-9a-f]{40}' logseq_chat.opam | sort -u); do
            url="${pin%%#*}"; sha="${pin##*#}"; name="$(basename "$url" .git)"
            if [ ! -d "duniverse/$name" ]; then
              git clone --quiet "https://github.com/$url" "duniverse/$name"
            fi
            # opam-monorepo may have already vendored this package at a
            # different ref with a partial clone lacking the pinned commit.
            if ! git -C "duniverse/$name" cat-file -e "$sha^{commit}" 2>/dev/null; then
              git -C "duniverse/$name" fetch --quiet "https://github.com/$url" "$sha" || \
                git -C "duniverse/$name" fetch --quiet "https://github.com/$url"
            fi
            git -C "duniverse/$name" checkout --quiet "$sha"
          done

      - name: Save duniverse
        if: steps.duniverse.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: duniverse
          key: duniverse-${{ hashFiles('logseq_chat.opam.locked', 'logseq_chat.opam') }}

      - name: Restore build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/dune
            .lg-cache
          key: build-cache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ github.ref_name }}-
            build-cache-main-

      - name: Enable dune shared cache
        run: |
          mkdir -p ~/.config/dune
          printf '(lang dune 3.0)\n(cache enabled)\n' > ~/.config/dune/config

      - name: Build and test OCaml core
        run: |
          eval $(opam env)
          dune build @shared/native/runtest

      - name: Save build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/dune
            .lg-cache
          key: build-cache-${{ github.ref_name }}-${{ github.sha }}
