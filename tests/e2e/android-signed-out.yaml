appId: com.logseq.chat
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.hosted-sign-in"
    # Cold-start on a CI emulator can take >5s for the core to boot.
    timeout: 30000
- assertVisible: ".*Logseq Chat.*"
- assertVisible: "Sign in"
- assertNotVisible: ".*LogseqAuthenticationError.*"
- assertNotVisible:
    id: "sidebar.navigation"
- assertNotVisible:
    id: "screen.graph-picker"
- assertNotVisible:
    id: "journals.graph-loaded"
- assertNotVisible:
    id: "journals.loading"
- assertNotVisible:
    id: "button.composer.expand"
- assertNotVisible:
    id: "button.search"
- assertNotVisible:
    id: "button.sidebar"
