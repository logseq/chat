appId: com.logseq.chat
---
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_SETUP_FLOW__"
- launchApp
- tapOn:
    id: "button.sidebar"
- tapOn: "E2E Page Target"
- extendedWaitUntil:
    visible:
      id: "section.node.linked-references"
    timeout: 30000
- tapOn:
    id: "button.connection"
- assertVisible: "Unfavorite"
- assertVisible: "Share"
- assertVisible: "Delete"
- assertNotVisible: "Settings"
- tapOn: "Unfavorite"
- tapOn:
    id: "button.connection"
- assertVisible: "Favorite"
- tapOn: "Favorite"
- tapOn:
    id: "button.connection"
- assertVisible: "Unfavorite"
- tapOn: "Delete"
- assertVisible: "Delete page?"
- tapOn: "Cancel"
- stopApp
- launchApp
- tapOn:
    id: "button.sidebar"
- tapOn: "E2E Page Target"
- extendedWaitUntil:
    visible:
      id: "section.node.linked-references"
    timeout: 30000
- tapOn:
    id: "button.connection"
- assertVisible: "Unfavorite"
- tapOn: "Delete"
- assertVisible: "Delete page?"
- tapOn:
    text: "Delete"
    index: 0
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 10000
- tapOn:
    id: "button.sidebar"
- assertNotVisible: "E2E Page Target"
