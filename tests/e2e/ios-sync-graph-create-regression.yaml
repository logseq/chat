appId: com.logseq.chat
---
- runFlow: __LOGSEQ_CHAT_E2E_SETUP_FLOW__
- runFlow:
    when:
      visible:
        id: "button.sidebar"
    commands:
      - tapOn:
          id: "button.sidebar"
      - tapOn:
          id: "link.sidebar.graphs"
      - tapOn:
          id: "button.graph-add"
- runFlow:
    when:
      visible: "Choose a graph"
    commands:
      - tapOn: "Add sync graph"
- extendedWaitUntil:
    visible: "Add sync graph"
    timeout: 60000
- tapOn:
    id: "field.graph-name"
- inputText: "wrangler-regression-__LOGSEQ_CHAT_E2E_RUN_ID__"
- tapOn:
    id: "button.graph-add.confirm"
- extendedWaitUntil:
    visible: "wrangler-regression-__LOGSEQ_CHAT_E2E_RUN_ID__"
    timeout: 60000
- assertNotVisible: "Add sync graph"
- extendedWaitUntil:
    visible:
      id: "journals.graph-loaded"
    timeout: 60000
- assertVisible: "Edit block Untitled block"
- assertNotVisible: "No cached blocks"
- assertNotVisible: "snapshot_download_failed"
- assertNotVisible: "snapshot required"
- assertVisible:
    id: "pane.journals"
- assertNotVisible:
    id: "button.content-mode"
- tapOn: "Edit block Untitled block"
- inputText: "First synced block"
- assertVisible: "First synced block"
- assertVisible:
    id: "toolbar.outliner.editor"
- extendedWaitUntil:
    visible: "Synced"
    timeout: 3000
- tapOn:
    id: "button.outliner.editor.task"
- assertNotVisible: "outliner_effect_failed"
- assertVisible:
    id: "toolbar.outliner.editor"
- extendedWaitUntil:
    visible: "Synced"
    timeout: 3000
- pressKey: ENTER
- assertVisible:
    id: "toolbar.outliner.editor"
- inputText: "#new"
- assertVisible:
    id: "toolbar.outliner.autocomplete"
- swipe:
    start: 85%, 55%
    end: 15%, 55%
    duration: 1200
- assertVisible:
    id: "toolbar.outliner.autocomplete"
- tapOn:
    id: "button.outliner.autocomplete.0"
- assertNotVisible:
    id: "toolbar.outliner.autocomplete"
- pressKey: ENTER
- pressKey: ENTER
- pressKey: BACKSPACE
- pressKey: BACKSPACE
- assertVisible:
    id: "toolbar.outliner.editor"
- tapOn: "Hide keyboard"
- assertNotVisible: "snapshot required"
- extendedWaitUntil:
    visible: "Synced"
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "sync.connected"
    timeout: 10000
- tapOn:
    id: "sync.connected"
- assertVisible: "Sync status"
- assertVisible: "Up to date"
- assertVisible: "wrangler-regression-__LOGSEQ_CHAT_E2E_RUN_ID__"
