appId: com.logseq.chat
---
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_SETUP_FLOW__"
- launchApp
- runFlow:
    when:
      visible:
        id: "button.sidebar.dismiss"
    commands:
      - tapOn:
          id: "button.sidebar.dismiss"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_OUTLINER_ANCHOR_FLOW__"
- tapOn: "Edit block E2E anchor A __LOGSEQ_CHAT_E2E_RUN_ID__"
- tapOn:
    id: "button.outliner.editor.audio"
- assertVisible: "Audio recording"
- assertVisible:
    id: "toggle.audio.transcription"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "Stop recording"
    timeout: 10000
- tapOn: "Stop recording"
- extendedWaitUntil:
    visible: "Audio-.*\\.m4a"
    timeout: 15000
- assertVisible:
    id: "player.asset.audio"
- tapOn:
    id: "player.asset.audio"
- assertVisible: "Pause audio"
- tapOn: "Pause audio"
- assertVisible: "Play audio"
- pressKey: Home
- waitForAnimationToEnd
- launchApp:
    stopApp: false
- waitForAnimationToEnd
- assertVisible: "Audio-.*"
- assertVisible:
    id: "player.asset.audio"
