appId: com.logseq.chat
---
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_SETUP_FLOW__"
- launchApp
- extendedWaitUntil:
    visible:
      id: "pane.journals"
    timeout: 30000
- assertVisible:
    id: "button.composer.expand"
- tapOn:
    id: "button.composer.expand"
- tapOn:
    id: "field.composer"
- inputText: "Chat send regression __LOGSEQ_CHAT_E2E_RUN_ID__"
- tapOn:
    id: "button.send"
- tapOn:
    id: "surface.composer.dismiss"
- assertVisible:
    id: "button.composer.expand"
- scrollUntilVisible:
    element:
      text: "Chat send regression __LOGSEQ_CHAT_E2E_RUN_ID__"
    direction: DOWN
    timeout: 30000
    speed: 50
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Chat send regression __LOGSEQ_CHAT_E2E_RUN_ID__"
- assertNotVisible: "invalid_json"
- stopApp
