appId: com.logseq.chat
---
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_SETUP_FLOW__"
- launchApp
- tapOn:
    id: "button.sidebar"
- tapOn:
    id: "link.sidebar.journals"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: "button.sidebar.dismiss"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "button.journal.e2e10000-0000-4000-8000-000000000007"
    direction: DOWN
    timeout: 30000
    speed: 50
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "button.journal.e2e10000-0000-4000-8000-000000000007"
- assertVisible:
    id: "BackButton"
- assertVisible:
    id: "button.connection"
- assertNotVisible: "unknown_node"
- tapOn:
    id: "button.connection"
- extendedWaitUntil:
    visible:
      id: "button.page-favorite"
    timeout: 10000
- assertVisible:
    id: "button.page-share"
- assertVisible:
    id: "button.page-delete"
- assertNotVisible: "Settings"
- tapOn:
    point: "50%,50%"
- tapOn:
    id: "BackButton"
- tapOn:
    id: "button.journal.e2e10000-0000-4000-8000-000000000007"
- assertVisible:
    id: "BackButton"
- assertNotVisible: "unknown_node"
- tapOn: "Zoom into E2E Block Target"
- assertVisible:
    id: "BackButton"
- assertVisible:
    id: "button.connection"
- assertVisible: "E2E Block Target"
- assertNotVisible: "unknown_node"
- tapOn:
    id: "BackButton"
- tapOn: "Zoom into E2E Block Target"
- assertVisible:
    id: "BackButton"
- assertVisible: "E2E Block Target"
- assertNotVisible: "unknown_node"
