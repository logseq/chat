appId: com.logseq.chat
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 30000
- assertVisible:
    id: "button.search"
- tapOn:
    id: "button.composer.expand"
- assertVisible:
    id: "field.composer"
- assertVisible:
    id: "button.attachment"
- assertVisible:
    id: "button.task-status"
- tapOn:
    id: "field.composer"
- inputText: "Android E2E capture"
- assertVisible:
    id: "button.send"
    enabled: true
- tapOn:
    id: "button.send"
- hideKeyboard
- tapOn:
    id: "surface.composer.dismiss"
- assertVisible:
    id: "button.composer.expand"
- tapOn:
    id: "button.search"
- assertVisible: "Search pages and blocks"
- tapOn:
    text: "Search pages and blocks"
- inputText: "Android E2E capture"
- hideKeyboard
- extendedWaitUntil:
    visible: "Android E2E capture"
    timeout: 30000
