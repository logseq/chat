appId: com.logseq.chat
---
- launchApp
- extendedWaitUntil:
    visible: ".*E2E Outliner Fixture.*"
    timeout: 30000
- tapOn: "Edit block E2E Outliner Fixture.*"
- assertVisible:
    id: "field.outliner.block.*"
- assertVisible:
    id: "toolbar.outliner.editor"
- assertVisible:
    id: "button.outliner.editor.task"
- assertVisible:
    id: "button.outliner.editor.outdent"
- assertVisible:
    id: "button.outliner.editor.indent"
- assertVisible:
    id: "button.outliner.editor.tag"
- assertVisible:
    id: "button.outliner.editor.camera"
- assertVisible:
    id: "button.outliner.editor.audio"
- assertVisible:
    id: "button.outliner.editor.attachment"
- assertVisible:
    id: "button.outliner.editor.pageReference"
- assertVisible: "Hide keyboard"
- assertVisible: "Task: None"
- tapOn:
    id: "button.outliner.editor.task"
- extendedWaitUntil:
    visible: "Task: Todo"
    timeout: 2000
- tapOn:
    id: "button.outliner.editor.task"
- extendedWaitUntil:
    visible: "Task: Doing"
    timeout: 2000
- tapOn:
    id: "button.outliner.editor.task"
- extendedWaitUntil:
    visible: "Task: Done"
    timeout: 2000
- tapOn:
    id: "button.outliner.editor.task"
- extendedWaitUntil:
    visible: "Task: None"
    timeout: 2000
- pressKey: ENTER
- inputText: "Android E2E continuous first"
- assertVisible: "Android E2E continuous first"
- pressKey: ENTER
- inputText: "Android E2E continuous second"
- assertVisible: "Android E2E continuous second"
- pressKey: ENTER
- pressKey: BACKSPACE
- assertVisible: "Android E2E continuous second"
- assertVisible:
    id: "toolbar.outliner.editor"
- tapOn:
    id: "button.outliner.editor.indent"
- assertVisible:
    id: "toolbar.outliner.editor"
- tapOn:
    id: "button.outliner.editor.outdent"
- assertVisible:
    id: "toolbar.outliner.editor"
- assertNotVisible: "outliner_effect_failed"
- tapOn: "Hide keyboard"
- assertVisible:
    id: "button.composer.expand"
- longPressOn: "Android E2E continuous first"
- assertVisible:
    id: "toolbar.outliner.selection"
- assertVisible:
    id: "button.outliner.selection.copy"
- assertVisible:
    id: "button.outliner.selection.delete"
- assertVisible:
    id: "button.outliner.selection.copyReference"
- assertVisible:
    id: "button.outliner.selection.copyURL"
- tapOn:
    id: "button.outliner.selection.delete"
- assertVisible: "Delete blocks?"
- tapOn: "Cancel"
- assertNotVisible:
    id: "toolbar.outliner.selection"
- assertVisible: "Android E2E continuous first"
- assertNotVisible: "outliner_effect_failed"
