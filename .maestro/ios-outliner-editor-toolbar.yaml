appId: com.logseq.chat
---
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_SETUP_FLOW__"
- launchApp
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_OUTLINER_ANCHOR_FLOW__"
- tapOn: "Edit block E2E anchor A __LOGSEQ_CHAT_E2E_RUN_ID__"
- assertVisible:
    id: "toolbar.outliner.editor"
- assertVisible: "Task: None"
- takeScreenshot: "docs/agent-guide/ui-comparison/ios/toolbars/editor-leading"
- tapOn:
    id: "button.outliner.editor.task"
- extendedWaitUntil:
    visible: "Task: Todo"
    timeout: 2000
- tapOn:
    id: "button.outliner.editor.task"
- extendedWaitUntil:
    visible: "Task: Doing"
    timeout: 2000
- tapOn:
    id: "button.outliner.editor.task"
- extendedWaitUntil:
    visible: "Task: Done"
    timeout: 2000
- tapOn:
    id: "button.outliner.editor.task"
- extendedWaitUntil:
    visible: "Task: None"
    timeout: 2000
- assertVisible:
    id: "toolbar.outliner.editor"
- tapOn:
    id: "button.outliner.editor.tag"
- assertVisible:
    id: "toolbar.outliner.autocomplete"
- pressKey: BACKSPACE
- swipe:
    start: 80%, 59%
    end: 15%, 59%
    duration: 800
- assertVisible:
    id: "toolbar.outliner.editor"
- takeScreenshot: "docs/agent-guide/ui-comparison/ios/toolbars/editor-trailing"
- tapOn:
    id: "button.outliner.editor.pageReference"
- assertVisible:
    id: "toolbar.outliner.autocomplete"
- tapOn:
    id: "button.outliner.autocomplete.0"
- assertNotVisible:
    id: "toolbar.outliner.autocomplete"
- tapOn:
    id: "button.outliner.editor.indent"
- assertVisible:
    id: "toolbar.outliner.editor"
- tapOn:
    id: "button.outliner.editor.outdent"
- assertVisible:
    id: "toolbar.outliner.editor"
- tapOn:
    id: "button.outliner.editor.camera"
- extendedWaitUntil:
    visible: "Back to Capture"
    timeout: 10000
- tapOn: "Back to Capture"
- assertVisible:
    id: "toolbar.outliner.editor"
- tapOn:
    id: "button.outliner.editor.camera"
- tapOn: "Attachment source"
- tapOn: "Photos"
- extendedWaitUntil:
    visible: "All Photos"
    timeout: 10000
- tapOn: "Back to Capture"
- assertVisible:
    id: "toolbar.outliner.editor"
- tapOn: "Hide keyboard"
- assertVisible:
    id: "button.composer.expand"
- assertNotVisible: "outliner_effect_failed"
