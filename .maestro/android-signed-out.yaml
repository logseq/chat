appId: com.logseq.chat
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen.authentication"
    timeout: 5000
- assertVisible: "Sign in"
- assertNotVisible: ".*LogseqAuthenticationError.*"
- assertNotVisible:
    id: "sidebar.navigation"
- assertNotVisible:
    id: "screen.graph-picker"
- assertNotVisible:
    id: "journals.graph-loaded"
- assertNotVisible:
    id: "journals.loading"
- assertNotVisible:
    id: "button.composer.expand"
- assertNotVisible:
    id: "button.search"
- assertNotVisible:
    id: "button.sidebar"
