appId: com.logseq.chat
---
- launchApp
- tapOn:
    id: "button.hosted-sign-in"
- runFlow:
    when:
      visible: "Use without an account"
    commands:
      - tapOn: "Use without an account"
- extendedWaitUntil:
    visible:
      id: "signInFormUsername"
    timeout: 30000
- tapOn:
    id: "signInFormUsername"
- inputText: ${USERNAME}
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- tapOn:
    id: "signInFormPassword"
- inputText: ${PASSWORD}
- hideKeyboard
- extendedWaitUntil:
    visible: "submit"
    timeout: 10000
- tapOn: "submit"
- extendedWaitUntil:
    visible:
      id: "screen.graph-picker"
    timeout: 60000
- runFlow:
    when:
      notVisible:
        id: "graph\\..*"
    commands:
      - tapOn:
          id: "button.graph-add"
      - extendedWaitUntil:
          visible:
            id: "form.graph-create"
          timeout: 10000
      - tapOn:
          id: "field.graph-name"
      - inputText: "android-e2e-graph"
      - hideKeyboard
      - tapOn:
          id: "toggle.graph-encryption"
      - tapOn:
          id: "button.graph-add.confirm"
- runFlow:
    when:
      visible:
        id: "graph\\..*"
    commands:
      - assertNotVisible:
          id: "sidebar.navigation"
      - tapOn:
          id: "graph\\..*"
          index: 0
      - runFlow:
          when:
            visible: "Unlock encrypted graphs"
          commands:
            - tapOn: "E2EE password"
            - inputText: ${PASSWORD}
            - hideKeyboard
            - tapOn: "Unlock"
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "button.connection"
    timeout: 30000
- tapOn:
    id: "button.connection"
- tapOn: "Settings"
- assertVisible:
    id: "sheet.settings"
- assertVisible:
    id: "button.connection.apply"
- tapOn:
    id: "button.connection.apply"
- assertVisible:
    id: "button.composer.expand"
