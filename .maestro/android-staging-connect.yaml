appId: com.logseq.chat
---
- launchApp
- tapOn:
    id: "field.email"
- inputText: ${USERNAME}
- tapOn:
    id: "field.password"
- inputText: ${PASSWORD}
- tapOn:
    id: "button.sign-in"
- extendedWaitUntil:
    visible:
      id: "button.connection"
    timeout: 30000
- tapOn:
    id: "button.connection"
- assertVisible: "Connection"
- tapOn:
    id: "field.base-url"
- eraseText
- inputText: ${BASE_URL}
- tapOn:
    id: "button.connection.apply"
- assertVisible:
    id: "button.composer.expand"
