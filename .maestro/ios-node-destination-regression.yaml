appId: com.logseq.chat
---
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_SETUP_FLOW__"
- launchApp
- tapOn:
    id: "button.sidebar"
- tapOn:
    id: "link.sidebar.journals"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: "button.sidebar.dismiss"
    timeout: 10000
- tapOn:
    id: "button.journal.*"
    index: 0
- assertVisible:
    id: "BackButton"
- assertVisible:
    id: "button.connection"
- assertNotVisible: "unknown_node"
- tapOn:
    id: "button.connection"
- extendedWaitUntil:
    visible:
      id: "button.page-favorite"
    timeout: 10000
- assertVisible:
    id: "button.page-share"
- assertVisible:
    id: "button.page-delete"
- assertNotVisible: "Settings"
- tapOn:
    point: "50%,50%"
- tapOn:
    id: "BackButton"
- tapOn:
    id: "button.journal.*"
    index: 0
- assertVisible:
    id: "BackButton"
- assertNotVisible: "unknown_node"
- tapOn:
    id: "BackButton"
- tapOn: "Edit block Untitled block"
- inputText: "E2E destination regression"
- tapOn:
    id: "button.send"
- tapOn: "Zoom into E2E destination regression"
- assertVisible:
    id: "BackButton"
- assertVisible:
    id: "button.connection"
- assertNotVisible: "unknown_node"
- tapOn:
    id: "BackButton"
- tapOn: "Zoom into E2E destination regression"
- assertVisible:
    id: "BackButton"
- assertNotVisible: "unknown_node"
