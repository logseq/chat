appId: com.logseq.chat
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Aug 21st, 2026"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "asset.preview.image"
    direction: UP
    timeout: 30000
    speed: 50
    visibilityPercentage: 80
    centerElement: true
- assertVisible:
    id: "asset.preview.image"
- assertNotVisible: "Sync failed"
