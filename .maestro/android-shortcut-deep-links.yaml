appId: com.logseq.chat
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 45000
- openLink: "logseqchat://capture"
- inputText: "x"
- eraseText: 1
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "surface.composer.root"
    timeout: 10000
- assertNotVisible:
    id: "button.composer.expand"
- openLink: "logseqchat://journal"
- extendedWaitUntil:
    visible:
      id: "pane.journals"
    timeout: 10000
- assertVisible:
    id: "button.sidebar"
