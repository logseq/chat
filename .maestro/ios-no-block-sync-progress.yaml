appId: com.logseq.chat
---
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_SETUP_FLOW__"
- launchApp
- tapOn:
    id: "button.content-mode"
- assertVisible:
    id: "list.outliner"
- assertVisible: "Aug 21st, 2026"
- tapOn: "Edit block Untitled block"
- pressKey: ENTER
- assertVisible:
    id: "toolbar.outliner.editor"
- assertNotVisible:
    text: "Syncing"
    childOf:
      id: "list.outliner"
