appId: com.logseq.chat
---
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_SETUP_FLOW__"
- launchApp
- assertVisible:
    id: "button.sidebar"
- runFlow:
    when:
      visible:
        id: "button.composer.expand"
    commands:
      - tapOn:
          id: "button.content-mode"
- scrollUntilVisible:
    element:
      id: "block.rich.quote"
    direction: DOWN
    timeout: 60000
    speed: 50
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "block.rich.quote"
- scrollUntilVisible:
    element:
      id: "block.rich.math"
    direction: DOWN
    timeout: 30000
    speed: 50
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "block.rich.math"
- scrollUntilVisible:
    element:
      id: "block.rich.codeBlock"
    direction: DOWN
    timeout: 30000
    speed: 50
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "block.rich.codeBlock"
- assertVisible: "swift"
- assertVisible: "let answer = 42"
- scrollUntilVisible:
    element:
      id: "block.rich.video"
    direction: DOWN
    timeout: 30000
    speed: 50
    visibilityPercentage: 20
    centerElement: true
- assertVisible:
    id: "block.rich.video"
- scrollUntilVisible:
    element:
      id: "block.rich.iframe"
    direction: DOWN
    timeout: 30000
    speed: 50
    visibilityPercentage: 20
    centerElement: true
- assertVisible:
    id: "block.rich.iframe"
