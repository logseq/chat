appId: com.logseq.chat
---
- launchApp
- assertVisible:
    text: "Enter your email"
- tapOn:
    text: "Enter your email"
- inputText: "__LOGSEQ_CHAT_E2E_USERNAME__"
- tapOn:
    text: "Enter your password"
- inputText: "__LOGSEQ_CHAT_E2E_PASSWORD__"
- tapOn:
    text: "Sign In"
    index: 1
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 30000
- assertVisible:
    id: "button.composer.expand"
- tapOn: "Search"
- assertVisible: "Search blocks"
- tapOn: "close"
- assertVisible:
    id: "button.composer.expand"
- tapOn:
    id: "button.connection"
- assertVisible: "Connection"
- assertVisible:
    id: "field.base-url"
- tapOn:
    id: "button.connection.cancel"
- assertVisible:
    id: "button.composer.expand"
- tapOn:
    id: "button.composer.expand"
- assertVisible:
    id: "field.composer"
- assertNotVisible: "Search blocks"
- assertVisible:
    id: "button.attachment"
- assertVisible:
    id: "button.task-status"
- inputText: "Clear me"
- eraseText: 8
- tapOn:
    id: "field.composer"
- inputText: "After clear"
- tapOn:
    id: "button.send"
- assertVisible:
    id: "field.composer"
- assertVisible: "After clear"
- inputText: "E2E capture responsive"
- tapOn:
    id: "button.send"
- assertVisible:
    id: "field.composer"
- assertVisible: "E2E capture responsive"
- tapOn: "E2E capture responsive"
- assertVisible:
    id: "button.composer.expand"
- tapOn: "E2E capture responsive"
- assertVisible:
    id: "field.composer"
- eraseText: 22
- inputText: "E2E block edited"
- tapOn:
    id: "button.send"
- assertVisible: "E2E block edited"
