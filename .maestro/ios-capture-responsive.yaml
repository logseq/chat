appId: com.logseq.chat
---
- runFlow:
    file: "__LOGSEQ_CHAT_E2E_SETUP_FLOW__"
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 30000
- assertVisible:
    id: "button.composer.expand"
- tapOn: "Search"
- assertVisible: "Search blocks"
- tapOn: "close"
- assertVisible:
    id: "button.composer.expand"
- tapOn:
    id: "button.connection"
- tapOn: "Settings"
- assertVisible: "Connection"
- assertVisible:
    id: "field.base-url"
- tapOn:
    id: "button.connection.cancel"
- assertVisible:
    id: "button.composer.expand"
- tapOn:
    id: "button.composer.expand"
- assertVisible:
    id: "field.composer"
- assertNotVisible: "Search blocks"
- assertVisible:
    id: "button.attachment"
- assertVisible:
    id: "button.task-status"
- inputText: "Clear me"
- eraseText: 8
- tapOn:
    id: "field.composer"
- inputText: "After clear __LOGSEQ_CHAT_E2E_RUN_ID__"
- tapOn:
    id: "button.send"
- assertVisible:
    id: "field.composer"
- assertVisible: "After clear __LOGSEQ_CHAT_E2E_RUN_ID__"
- inputText: "E2E capture __LOGSEQ_CHAT_E2E_RUN_ID__"
- tapOn:
    id: "button.send"
- assertVisible:
    id: "field.composer"
- assertVisible: "E2E capture __LOGSEQ_CHAT_E2E_RUN_ID__"
- tapOn: "E2E capture __LOGSEQ_CHAT_E2E_RUN_ID__"
- assertVisible:
    id: "button.composer.expand"
- tapOn: "E2E capture __LOGSEQ_CHAT_E2E_RUN_ID__"
- assertVisible:
    id: "field.composer"
- eraseText: 22
- inputText: "E2E edited __LOGSEQ_CHAT_E2E_RUN_ID__"
- tapOn:
    id: "button.send"
- assertVisible: "E2E edited __LOGSEQ_CHAT_E2E_RUN_ID__"
